[package]
name = "clank_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libm = "0.2.11"
rkyv = { version = "0.7.44", default-features = false, features = ["alloc", "size_32", "validation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
