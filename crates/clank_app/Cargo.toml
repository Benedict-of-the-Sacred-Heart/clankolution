[package]
name = "clank_app"
version = "0.1.0"
edition = "2021"

[dependencies]
clank_core = { path = "../clank_core" }
bevy = { version = "0.19.1", default-features = true }
bevy_egui = "0.41.0"
rkyv = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
bytemuck = { version = "1.21", features = ["derive"] }
wgpu = { version = "29.0", default-features = false }
half = "2.7"

# Metal's `isHeadless`, to run headless GPU work on a card that drives no display. Already in
# the build through wgpu-hal; this only makes it nameable.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[[bench]]
name = "gpu_microbench"
harness = false
